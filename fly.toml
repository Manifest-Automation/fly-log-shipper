# fly.toml app configuration file generated for manifest-log-shipper on 2023-08-29T16:42:54-07:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = "manifest-log-shipper"
primary_region = "sjc"

[env]
  ORG="manifest-automation"
  # Tailscale tag (start-fly-log-transporter.sh): the tailnet policy lets it reach the Grafana LGTM stack's OTLP port.
  # Borrows the apps' production tag.
  TS_ADVERTISE_TAG="tag:fly-app-prd"

# NET_ADMIN and /dev/net/tun for tailscaled
[experimental]
  enable_tun = true

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[metrics]
  port = 9598
  path = "/metrics"

[[services]]
  http_checks = []
  internal_port = 8686
