[api]
  enabled = true
  address = "[::]:8686"

[sources.fly_log_metrics]
  type = "internal_metrics"

[sources.nats]
  type = "nats"
  url = "nats://[${NETWORK-fdaa}::3]:4223"
  queue = "${QUEUE-}"
  subject = "${SUBJECT-logs.>}"
  auth.strategy = "user_password"
  auth.user_password.user = "${ORG-personal}"
  auth.user_password.password = "${ACCESS_TOKEN?}"
  connection_name = "Fly logs stream"

# Define the source for your first app
[sources.manifest_admin_app]
type = "prometheus_scrape"
endpoints = [ "https://api.fly.io/prometheus/manifest-automation/federate" ]
auth.strategy = 'bearer'
auth.token = '${ACCESS_TOKEN}'
query.match = ['{app="manifest-admin"}']

# Define the source for your first app
[sources.manifest_agents_app]
type = "prometheus_scrape"
endpoints = [ "https://api.fly.io/prometheus/manifest-automation/federate" ]
auth.strategy = 'bearer'
auth.token = '${ACCESS_TOKEN}'
query.match = ['{app="manifest-agents"}']

# Define the source for your second app
[sources.manifest_fast_sockets_app]
type = "prometheus_scrape"
endpoints = [ "https://api.fly.io/prometheus/manifest-automation/federate" ]
auth.strategy = 'bearer'
auth.token = '${ACCESS_TOKEN}'
query.match = ['{app="manifest-fast-sockets"}']

# Define the source for your second app
[sources.manifest_ssh_app]
type = "prometheus_scrape"
endpoints = [ "https://api.fly.io/prometheus/manifest-automation/federate" ]
auth.strategy = 'bearer'
auth.token = '${ACCESS_TOKEN}'
query.match = ['{app="manifest-ssh"}']

# Update the sinks block to include all the source names
[sinks.datadog_metrics]
type = "datadog_metrics"
inputs = [ "manifest_admin_app", "manifest_fast_sockets_app", "manifest_agents_app"]  # Include all source names here
default_api_key = "${DATADOG_API_KEY}"
default_namespace = "manifest"
site = "us5.datadoghq.com"


[transforms.log_json]
  type = "remap"
  inputs = ["nats"]
  source = '''
  . = parse_json!(.message)
  '''

[sinks.fly_log_metrics_prometheus]
  type = "prometheus_exporter" # required
  inputs = ["fly_log_metrics"] # required
  address = "[::]:9598" # required
  default_namespace = "fly-logs" # optional, no default

[sinks.blackhole]
  type = "blackhole"
  inputs = ["log_json"]
  print_interval_secs = 100000
