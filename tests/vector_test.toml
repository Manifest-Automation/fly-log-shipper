    type = "log"
    [tests.inputs.log_fields]
      "event.provider" = "app"
      "fly.app.name" = "magic-max-production"
      message = "{\"asctime\": \"2026-11-18 05:41:29,417\", \"levelname\": \"INFO\"}"

